# Recordatorios de cosas que caducan (plan 028 T266): corre
# apps/web/scripts/recordatorios.mjs, que lee apps/web/scripts/caducidades.json
# y abre un issue por cada cosa a la que le quedan 60, 30 o 7 días (si ya hay
# uno abierto, comenta en él), más uno al mes para enviar un correo desde
# hola@ (si el del mes anterior sigue abierto, comenta en él). No cierra nada.
# Sólo usa el GITHUB_TOKEN del flujo; no hacen falta secretos.
#
# Corre cada lunes, no una vez al mes: con una sola pasada mensual el aviso de
# 7 días casi nunca caería en su semana. El script no repite nada (marcas en
# los issues), así que el recordatorio mensual sigue saliendo una vez al mes.
#
# A mano (Actions → recordatorios → Run workflow) se puede pedir sólo el
# ensayo («dry_run») y para otra fecha.
name: recordatorios

on:
  schedule:
    # Cada lunes a las 07:23 UTC.
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sólo ensayo: escribe lo que haría, sin abrir ni comentar nada'
        type: boolean
        default: false
      fecha:
        description: 'Hacer como si hoy fuera esta fecha (AAAA-MM-DD; vacío = hoy)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  recordatorios:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Sólo para el script y su lista; no instala dependencias.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Abrir o comentar los issues que toquen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          FECHA: ${{ inputs.fecha }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$FECHA" ] && args+=(--fecha "$FECHA")
          node apps/web/scripts/recordatorios.mjs "${args[@]}"

  # GitHub desactiva los flujos programados de un repo público tras 60 días
  # sin actividad. Este trabajo vuelve a activar (API «Enable a workflow») los
  # flujos activos o desactivados por inactividad, éste incluido; los que
  # alguien desactivó a mano se quedan así. Va igual en todos los flujos
  # programados (plan 028 T266, docs/DESPLIEGUE.md §8), y aparte, para que un
  # fallo aquí no tumbe el trabajo de arriba ni al revés.
  keepalive-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reactivar los flujos programados
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | "\(.id) \(.state) \(.path)"' \
            > "$RUNNER_TEMP/workflows.txt"
          fail=0
          while read -r id state wf; do
            if gh api --method PUT "repos/$REPO/actions/workflows/$id/enable" --silent; then
              echo "activo: $wf (antes: $state)"
            else
              echo "::error::No se pudo reactivar $wf"
              fail=1
            fi
          done < "$RUNNER_TEMP/workflows.txt"
          exit "$fail"
