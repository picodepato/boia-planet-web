# Mantiene despierto el proyecto Supabase del plan gratuito, que se pausa
# tras 7 días sin uso. Dos lecturas por semana (lunes y jueves) dejan margen
# si una falla. Secretos del repo (Settings → Secrets and variables →
# Actions): SUPABASE_URL y SUPABASE_ANON_KEY, los mismos que
# NEXT_PUBLIC_SUPABASE_URL y NEXT_PUBLIC_SUPABASE_ANON_KEY.
name: supabase-keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leer una fila pública
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "Faltan los secretos"; exit 1; }
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' \
            "$SUPABASE_URL/rest/v1/carnet_questions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

  # GitHub desactiva los flujos programados de un repo público tras 60 días
  # sin actividad. Este trabajo vuelve a activar (API «Enable a workflow») los
  # flujos activos o desactivados por inactividad, éste incluido; los que
  # alguien desactivó a mano se quedan así. Va igual en todos los flujos
  # programados (plan 028 T266, docs/DESPLIEGUE.md §8), y aparte, para que un
  # fallo aquí no tumbe el trabajo de arriba ni al revés.
  keepalive-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reactivar los flujos programados
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | "\(.id) \(.state) \(.path)"' \
            > "$RUNNER_TEMP/workflows.txt"
          fail=0
          while read -r id state wf; do
            if gh api --method PUT "repos/$REPO/actions/workflows/$id/enable" --silent; then
              echo "activo: $wf (antes: $state)"
            else
              echo "::error::No se pudo reactivar $wf"
              fail=1
            fi
          done < "$RUNNER_TEMP/workflows.txt"
          exit "$fail"
